version: '3.8'

services:
  # --- 1. THE STORAGE LAYER (PostgreSQL) ---
  postgres:
    image: postgres:15-alpine
    container_name: job_engine_postgres
    environment:
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_password
      POSTGRES_DB: job_engine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - engine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d job_engine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. THE BROKER LAYER (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: job_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - engine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 3. THE METRICS SCRAPER (Prometheus) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: job_engine_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - engine-network

  # --- 4. THE OBSERVABILITY DASHBOARD (Grafana) ---
  grafana:
    image: grafana/grafana:latest
    container_name: job_engine_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - engine-network
    depends_on:
      - prometheus
  

  # --- 5. THE API INGESTION LAYER ---
  api:
    build:
      context: .. # Point to the root directory
      dockerfile: docker/Dockerfile.api
    container_name: job_engine_api
    ports:
      - "8000:8000"
    environment:
      # Tell the API how to find the Postgres and Redis containers
      - DATABASE_URL=postgresql://engine_user:engine_password@postgres:5432/job_engine_db
      - REDIS_URL=redis://redis:6379/0
    networks:
      - engine-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- 6. THE EXECUTION WORKER ---
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: job_engine_worker
    environment:
      - DATABASE_URL=postgresql://engine_user:engine_password@postgres:5432/job_engine_db
      - REDIS_URL=redis://redis:6379/0
    networks:
      - engine-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  engine-network:
    driver: bridge

  