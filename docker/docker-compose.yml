version: '3.8'

services:
  # --- 1. THE STORAGE LAYER (PostgreSQL) ---
  postgres:
    image: postgres:15-alpine
    container_name: job_engine_postgres
    environment:
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_password
      POSTGRES_DB: job_engine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - engine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d job_engine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. THE BROKER LAYER (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: job_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - engine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 3. THE METRICS SCRAPER (Prometheus) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: job_engine_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - engine-network

  # --- 4. THE OBSERVABILITY DASHBOARD (Grafana) ---
  grafana:
    image: grafana/grafana:latest
    container_name: job_engine_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - engine-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  engine-network:
    driver: bridge